name: temporary-ui-fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old='header>div:first-child{min-width:0} header small{font-weight:500;color:var(--mut);display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
          new='header>div:first-child{min-width:0} header small{font-weight:600;color:var(--mut);display:inline-flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;overflow:visible;text-overflow:clip;padding:2px 9px;margin-left:2px;border-radius:999px;border:1px solid var(--line)}'
          s=s.replace(old,new)
          old='function sub(){$("agentTitle").firstChild.textContent=agentName();const s=$("sub");const ok=!!S("agent_key");s.textContent=ok?"AI подключён":"AI не подключён";s.className=ok?"ai-on":"ai-off"}'
          new='let aiConnected=!!S("agent_key");function sub(){$("agentTitle").firstChild.textContent=agentName();const s=$("sub");s.textContent=aiConnected?"AI ON":"AI OFF";s.className=aiConnected?"ai-on":"ai-off"}'
          s=s.replace(old,new)
          old='S("agent_key",key);st.textContent="✓ Доступ активен · AI готов";st.className="access-status ok";sub();'
          new='S("agent_key",key);aiConnected=true;st.textContent="✓ Доступ активен · AI готов";st.className="access-status ok";sub();'
          s=s.replace(old,new)
          old='}catch(e){st.textContent="Ключ не принят или доступ недоступен.";st.className="access-status bad"}'
          new='}catch(e){aiConnected=false;sub();st.textContent="Ключ не принят или доступ недоступен.";st.className="access-status bad"}'
          s=s.replace(old,new)
          old='try{await run(userContent)}catch(err){console.error(err);add("a","Не удалось получить ответ. Проверь подключение провайдера в Настройках.")}finally{'
          new='try{await run(userContent);aiConnected=true;sub()}catch(err){console.error(err);aiConnected=false;sub();add("a","Не удалось получить ответ. Проверь подключение провайдера в Настройках.")}finally{'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit UI fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temporary-ui-fix.yml
          git add index.html .github/workflows/temporary-ui-fix.yml
          git diff --cached --quiet || git commit -m "Fix AI status indicator UI"
          git push
