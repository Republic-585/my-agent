<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Agent — Admin</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#0b0d10}main{max-width:900px;margin:auto;padding:24px 16px 48px}.card{background:#15181d;border:1px solid #282d35;border-radius:18px;padding:18px;margin:12px 0}h1{font-size:26px;margin:4px 0 20px}h2{font-size:17px;margin:0 0 14px}input,select,button{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #343a44;background:#0f1216;color:#fff;font:inherit;margin:5px 0}button{background:#fff;color:#111;font-weight:700;cursor:pointer}button.secondary{background:#20252c;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.row{grid-template-columns:1fr}}.hidden{display:none}.muted{color:#9ca4af;font-size:13px}.status{margin:10px 0;padding:10px;border-radius:10px;background:#20252c;white-space:pre-wrap}.key{font-family:ui-monospace,monospace;word-break:break-all;background:#0b0d10;padding:12px;border-radius:10px;margin-top:8px}.admin{color:#9ee6b8;font-size:13px;margin-top:-12px;margin-bottom:14px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid #292e36}th{color:#9ca4af}.actions{display:flex;gap:6px}.actions button{margin:0;width:auto;padding:8px 10px}.copy{margin-top:8px}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main>
<h1>AI Agent — админ-панель</h1>
<section id="login" class="card"><h2>Вход администратора</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><div id="loginStatus" class="status hidden"></div></section>
<section id="panel" class="hidden">
<div class="card"><div class="admin" id="adminIdentity"></div><div class="row"><div><h2>Создать ключ доступа</h2><div class="muted">Ключ генерируется на сервере и показывается полностью только один раз.</div></div><div><button id="logout" class="secondary">Выйти</button></div></div>
<div class="row"><select id="userId"><option value="">Без привязки к пользователю</option></select><select id="plan"><option value="pro">pro</option><option value="basic">basic</option><option value="trial">trial</option></select></div>
<div class="row"><input id="daily" type="number" value="500" min="1" placeholder="Лимит в день"><input id="monthly" type="number" value="10000" min="1" placeholder="Лимит в месяц"></div>
<input id="expires" type="datetime-local"><button id="createBtn">Сгенерировать ключ</button><div id="createStatus" class="status hidden"></div></div>
<div class="card"><div class="row"><h2>Ключи доступа</h2><button id="refresh" class="secondary">Обновить</button></div><div id="keys">Загрузка…</div></div>
</section></main>
<script>
const U="https://dfvztoazthliaobqnndv.supabase.co",K="sb_publishable_rklL_02gyQi9Va_Ow6BS-w_d1QeN947",FN=U+"/functions/v1/agent-admin",sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));function msg(id,t){$(id).textContent=t;$(id).classList.remove("hidden")}
async function sess(){return(await sb.auth.getSession()).data.session}
async function api(body){const s=await sess();if(!s)throw Error("Сессия не найдена");const r=await fetch(FN,{method:"POST",headers:{Authorization:"Bearer "+s.access_token,"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка");return d}
async function loadUsers(){const d=await api({action:"users"}),sel=$("userId");sel.innerHTML='<option value="">Без привязки к пользователю</option>'+(d.users||[]).map(u=>'<option value="'+esc(u.id)+'">'+esc(u.name||"Без имени")+(u.email?" · "+esc(u.email):"")+'</option>').join("")}
async function load(){try{const d=await api({action:"list"});$("adminIdentity").textContent="Администратор: "+(d.admin?.email||"авторизованный пользователь");const rows=d.keys||[];if(!rows.length){$("keys").innerHTML='<div class="muted">Ключей пока нет.</div>';return}$("keys").innerHTML='<div style="overflow:auto"><table><thead><tr><th>Ключ</th><th>Пользователь</th><th>План</th><th>Статус</th><th>Срок</th><th></th></tr></thead><tbody>'+rows.map(k=>'<tr><td><code>'+esc(k.key_prefix)+'…</code></td><td><code>'+esc(k.user_id||"—")+'</code></td><td>'+esc(k.plan)+'</td><td>'+esc(k.status)+'</td><td>'+(k.expires_at?new Date(k.expires_at).toLocaleString():"∞")+'</td><td><div class="actions">'+(k.status==="active"?'<button data-a="pause" data-id="'+esc(k.id)+'">Пауза</button>':'')+(k.status==="paused"?'<button data-a="resume" data-id="'+esc(k.id)+'">Включить</button>':'')+(k.status!=="revoked"?'<button data-a="revoke" data-id="'+esc(k.id)+'">Отозвать</button>':'')+'</div></td></tr>').join("")+'</tbody></table></div>'}catch(e){$("keys").textContent=e.message}}
async function openPanel(){ $("login").classList.add("hidden");$("panel").classList.remove("hidden");try{await loadUsers();await load()}catch(e){$("panel").classList.add("hidden");$("login").classList.remove("hidden");msg("loginStatus",e.message)}}
$("loginBtn").onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;await openPanel()}catch(e){msg("loginStatus",e.message)}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};
$("createBtn").onclick=async()=>{try{const v=$("expires").value;const d=await api({action:"create",user_id:$("userId").value||null,plan:$("plan").value,daily_limit:Number($("daily").value),monthly_limit:Number($("monthly").value),expires_at:v?new Date(v).toISOString():null});$("createStatus").classList.remove("hidden");$("createStatus").innerHTML='Скопируйте ключ сейчас:<div class="key">'+esc(d.key)+'</div><button class="copy secondary" id="copyKey">Копировать ключ</button>';const b=$("copyKey");b.onclick=()=>navigator.clipboard?.writeText(d.key);load()}catch(e){msg("createStatus",e.message)}};
$("refresh").onclick=async()=>{await loadUsers();await load()};document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;try{await api({action:b.dataset.a,id:b.dataset.id});await load()}catch(x){alert(x.message)}});
(async()=>{if(await sess())await openPanel()})();</script></body></html>
