<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Agent — Admin</title>
<style>:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#0b0d10;color:#f5f7fa}*{box-sizing:border-box}body{margin:0;background:#0b0d10}main{max-width:1100px;margin:auto;padding:20px 14px 48px}.card{background:#15181d;border:1px solid #282d35;border-radius:18px;padding:16px;margin:10px 0}h1{font-size:25px;margin:4px 0 18px}h2{font-size:16px;margin:0 0 12px}.muted{color:#9ca4af;font-size:12px}input,select,button{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #343a44;background:#0f1216;color:#fff;font:inherit;margin:4px 0}button{background:#fff;color:#111;font-weight:700}button.secondary{background:#20252c;color:#fff}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.tabs{display:flex;gap:7px;overflow:auto;margin:8px 0}.tabs button{width:auto;white-space:nowrap}.tabs button.on{background:#fff;color:#111}.hidden{display:none}.status{padding:10px;border-radius:10px;background:#20252c;white-space:pre-wrap;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:13px;border:1px solid #292e36;border-radius:14px;background:#101318}.stat b{display:block;font-size:23px;margin-top:3px}table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:9px 6px;border-bottom:1px solid #292e36;vertical-align:top}th{color:#9ca4af}.actions{display:flex;gap:5px}.actions button{width:auto;margin:0;padding:7px 9px}.key{font-family:ui-monospace,monospace;word-break:break-all;background:#0b0d10;padding:11px;border-radius:10px;margin-top:7px}@media(max-width:700px){.row4,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.row{grid-template-columns:1fr}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>AI Agent — админ-панель</h1>
<section id="login" class="card"><h2>Вход администратора</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Пароль"><button id="loginBtn">Войти</button><div id="loginStatus" class="status hidden"></div></section>
<section id="panel" class="hidden"><div class="card"><div class="row"><div><b id="identity">Администратор</b><div class="muted">Управление агентом, доступом и оплатами</div></div><button id="logout" class="secondary">Выйти</button></div></div>
<div class="tabs"><button data-tab="overview" class="on">Обзор</button><button data-tab="users">Пользователи</button><button data-tab="keys">Ключи</button><button data-tab="orders">Оплаты</button></div>
<section id="overview" class="tab"><div class="stats" id="stats"></div><div class="card"><h2>Тарифы</h2><div id="plans" class="muted">Загрузка…</div></div></section>
<section id="users" class="tab hidden"><div class="card"><div class="row"><h2>Пользователи</h2><button id="refreshUsers" class="secondary">Обновить</button></div><input id="userSearch" placeholder="Поиск по email / имени"><div id="usersTable">Загрузка…</div></div></section>
<section id="keys" class="tab hidden"><div class="card"><h2>Создать ключ</h2><div class="muted">Полный ключ показывается один раз.</div><div class="row"><select id="userId"><option value="">Без привязки</option></select><select id="plan"><option value="pro">pro</option><option value="pro_year">pro_year</option><option value="trial">trial</option></select></div><div class="row"><input id="daily" type="number" value="500" min="1"><input id="monthly" type="number" value="10000" min="1"></div><input id="expires" type="datetime-local"><button id="createBtn">Сгенерировать ключ</button><div id="createStatus" class="status hidden"></div></div><div class="card"><div class="row"><h2>Ключи доступа</h2><button id="refreshKeys" class="secondary">Обновить</button></div><div id="keysTable">Загрузка…</div></div></section>
<section id="orders" class="tab hidden"><div class="card"><div class="row"><h2>Оплаты</h2><button id="refreshOrders" class="secondary">Обновить</button></div><div id="ordersTable">Загрузка…</div></div></section>
</section></main><script>
const U="https://dfvztoazthliaobqnndv.supabase.co",K="sb_publishable_rklL_02gyQi9Va_Ow6BS-w_d1QeN947",FN=U+"/functions/v1/agent-admin",sb=supabase.createClient(U,K,{auth:{persistSession:true,autoRefreshToken:true}}),$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function sess(){return(await sb.auth.getSession()).data.session}async function api(body){const s=await sess();if(!s)throw Error("Сессия не найдена");const r=await fetch(FN,{method:"POST",headers:{Authorization:"Bearer "+s.access_token,"Content-Type":"application/json"},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Ошибка");return d}
function show(t){document.querySelectorAll(".tab").forEach(x=>x.classList.add("hidden"));$(t).classList.remove("hidden");document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x.dataset.tab===t))}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{show(b.dataset.tab);if(b.dataset.tab==="overview")loadOverview();if(b.dataset.tab==="users")loadUsers();if(b.dataset.tab==="keys")loadKeys();if(b.dataset.tab==="orders")loadOrders()});
async function loadOverview(){try{const[d,p]=await Promise.all([api({action:"stats"}),api({action:"plans"})]);const s=d.stats||{};$("stats").innerHTML=[["Пользователи",s.users],["Активные ключи",s.keys_active],["Запросов сегодня",s.requests_today],["Запросов за месяц",s.requests_month],["Оплачено",s.paid_orders],["Выручка",((s.revenue_cents||0)/100).toFixed(2)+" USD"],["Всего ключей",s.keys_total],["Отозвано",s.keys_revoked]].map(x=>'<div class="stat"><span class="muted">'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join("");$("plans").innerHTML=(p.plans||[]).map(x=>'<div style="padding:8px 0;border-bottom:1px solid #292e36"><b>'+esc(x.title)+'</b> — '+esc((x.price_cents/100).toFixed(2))+' '+esc(x.currency)+' / '+esc(x.days)+' дней · '+esc(x.monthly_limit)+' запросов/мес</div>').join("")||"Нет тарифов"}catch(e){$("stats").textContent=e.message}}
async function loadUsers(){try{const d=await api({action:"users"}),q=$("userSearch").value.trim().toLowerCase(),rows=(d.users||[]).filter(u=>(u.email+" "+u.name).toLowerCase().includes(q));$("usersTable").innerHTML='<div style="overflow:auto"><table><tr><th>Пользователь</th><th>ID</th><th>Ключи</th><th>Создан</th><th>Вход</th></tr>'+rows.map(u=>'<tr><td><b>'+esc(u.name||"Без имени")+'</b><br>'+esc(u.email)+'</td><td><code>'+esc(u.id)+'</code></td><td>'+esc(u.keys.active)+' / '+esc(u.keys.total)+'</td><td>'+new Date(u.created_at).toLocaleDateString()+'</td><td>'+(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString():"—")+'</td></tr>').join("")+'</table></div>'}catch(e){$("usersTable").textContent=e.message}}
async function loadKeys(){try{const d=await api({action:"list"});$("identity").textContent="Администратор: "+(d.admin?.email||"");const rows=d.keys||[];$("keysTable").innerHTML='<div style="overflow:auto"><table><tr><th>Ключ</th><th>Пользователь</th><th>План</th><th>Статус</th><th>Лимиты</th><th>Срок</th><th></th></tr>'+rows.map(k=>'<tr><td><code>'+esc(k.key_prefix)+'…</code></td><td><code>'+esc(k.user_id||"—")+'</code></td><td>'+esc(k.plan)+'</td><td>'+esc(k.status)+'</td><td>'+esc(k.daily_limit)+' / '+esc(k.monthly_limit)+'</td><td>'+(k.expires_at?new Date(k.expires_at).toLocaleString():"∞")+'</td><td><div class="actions">'+(k.status==="active"?'<button data-a="pause" data-id="'+esc(k.id)+'">Пауза</button>':"")+(k.status==="paused"?'<button data-a="resume" data-id="'+esc(k.id)+'">Включить</button>':"")+(k.status!=="revoked"?'<button data-a="revoke" data-id="'+esc(k.id)+'">Отозвать</button>':"")+'</div></td></tr>').join("")+'</table></div>'}catch(e){$("keysTable").textContent=e.message}}
async function loadOrders(){try{const d=await api({action:"orders"}),rows=d.orders||[];$("ordersTable").innerHTML='<div style="overflow:auto"><table><tr><th>Дата</th><th>План</th><th>Сумма</th><th>Статус</th><th>Ключ</th></tr>'+rows.map(o=>'<tr><td>'+new Date(o.created_at).toLocaleString()+'</td><td>'+esc(o.plan_id)+'</td><td>'+esc((o.amount_cents/100).toFixed(2))+' '+esc(o.currency)+'</td><td>'+esc(o.status)+'</td><td><code>'+esc(o.access_key_id||"—")+'</code></td></tr>').join("")+'</table></div>'}catch(e){$("ordersTable").textContent=e.message}}
async function loadAll(){await loadOverview();await loadUsers();await loadKeys();await loadOrders()}
$("loginBtn").onclick=async()=>{try{const{error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)throw error;$("login").classList.add("hidden");$("panel").classList.remove("hidden");await loadAll()}catch(e){$("loginStatus").textContent=e.message;$("loginStatus").classList.remove("hidden")}};
$("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};$("userSearch").oninput=loadUsers;$("refreshUsers").onclick=loadUsers;$("refreshKeys").onclick=loadKeys;$("refreshOrders").onclick=loadOrders;
$("createBtn").onclick=async()=>{try{const v=$("expires").value,d=await api({action:"create",user_id:$("userId").value||null,plan:$("plan").value,daily_limit:Number($("daily").value),monthly_limit:Number($("monthly").value),expires_at:v?new Date(v).toISOString():null});$("createStatus").classList.remove("hidden");$("createStatus").innerHTML='Скопируйте ключ сейчас:<div class="key">'+esc(d.key)+'</div><button id="copyKey" class="secondary">Копировать</button>';$("copyKey").onclick=()=>navigator.clipboard?.writeText(d.key);loadKeys()}catch(e){$("createStatus").textContent=e.message;$("createStatus").classList.remove("hidden")}};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b)return;try{await api({action:b.dataset.a,id:b.dataset.id});await loadKeys();await loadOverview()}catch(x){alert(x.message)}});
async function init(){if(await sess()){$("login").classList.add("hidden");$("panel").classList.remove("hidden");await loadAll()}}init();
</script></body></html>
